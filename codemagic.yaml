workflows:
  android:
    name: OurChat Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 21
    scripts:
      - name: Create android project
        script: flutter create . --org com.ourchat --project-name ourchat --platforms android
      - name: Add packages
        script: flutter pub add firebase_core firebase_auth cloud_firestore google_sign_in
      - name: Setup Firebase
        script: |
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          import os
          kts = os.path.exists('android/settings.gradle.kts')
          ext = '.gradle.kts' if kts else '.gradle'
          if kts:
              l1 = '    id("com.google.gms.google-services") version "4.4.2" apply false'
              l2 = '    id("com.google.gms.google-services")'
          else:
              l1 = '    id "com.google.gms.google-services" version "4.4.2" apply false'
              l2 = '    id "com.google.gms.google-services"'
          def add(path, key, line):
              out, done = [], False
              for l in open(path).read().split('\n'):
                  out.append(l)
                  if not done and key in l:
                      out.append(line)
                      done = True
              open(path, 'w').write('\n'.join(out))
          add('android/settings' + ext, 'org.jetbrains.kotlin.android', l1)
          add('android/app/build' + ext, 'com.android.application', l2)
          PY
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
